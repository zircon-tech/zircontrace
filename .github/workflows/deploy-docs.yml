name: Deploy ZirconTrace sites

on:
  push:
    branches: [main]
    paths:
      - 'site-publico/**'
      - 'site-publico-en/**'
      - 'site-interno/**'
      - 'methodology/**'
      - 'presentation/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r site-publico/requirements.txt
      - run: mkdocs build --config-file mkdocs.yml --site-dir ../_site
        working-directory: site-publico
      - run: mkdocs build --config-file mkdocs.yml --site-dir ../_site/en
        working-directory: site-publico-en
      - run: mkdocs build --config-file mkdocs.yml --site-dir ../_site/interno
        working-directory: site-interno
      - run: |
          mkdir -p _site/presentation
          cp presentation/*.html presentation/*.png presentation/*.webp presentation/*.jpg _site/presentation/
      - run: |
          printf 'User-agent: *\nDisallow: /interno/\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
