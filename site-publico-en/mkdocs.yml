site_name: ZirconTrace™ · ZirconTech
site_description: "How we work: ZirconTech's TRACE cycle"
site_url: https://zircon-tech.github.io/zircontrace/en/
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.jpg
  language: en
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
extra_css:
  - stylesheets/zircontech.css
extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js
nav:
  - Home: index.md
  - The TRACE cycle:
      - Overview: cycle-trace.md
      - Target: etapas/target.md
      - Read: etapas/read.md
      - Architect: etapas/architect.md
      - Craft: etapas/craft.md
      - Evolve: etapas/evolve.md
  - How we work: how-we-work.md
  - Resources:
      - Glossary: glossary.md
      - References: references.md
  - Contact: contact.md
  - Español: https://zircon-tech.github.io/zircontrace/
markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
